<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARテスト</title>
  <link rel="stylesheet" href="./style.css">
  <!-- Mind-ARとA-Frameを読み込む -->
  <!--<script src="https://aframe.io"></script>-->
  <!--<script src="https://jsdelivr.net"></script>-->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="./script.js" defer></script>
</head>

<body class="camera-pending">
  <p class="spoiler-warning">
    この機能は華Doll* 3rd season までのネタバレを含みます。<br>ネタバレなしで本編を楽しみたい方はお気をつけください
  </p>
  <p id="permission-status" class="permission-status">カメラの許可を確認しています...</p>

  <section id="camera-error" class="camera-error" role="alert" hidden>
    <p id="camera-error-message"></p>
  </section>

  <a class="camera-fallback-link" href="./image.html" hidden>カメラ機能を使用しない</a>

  <!-- ARシーンの設定。imageTargetSrcでステップ1の指定ファイルを読み込む -->
  <a-scene mindar-image="autoStart: false; imageTargetSrc: ./image/targets.mind; filterMinCF:0.01; filterBeta:100;"
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-assets>
      <img id="anthos-member-1" src="./image/Anthosメンバー1.png" />
      <img id="anthos-member-2" src="./image/Anthosメンバー2.png" />
      <img id="louloudi-members" src="./image/Louloudiメンバー.png" />
      <img id="relationship-chart" src="./image/相関図.png" />
    </a-assets>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane src="#anthos-member-1" material="position="0 0 0" height="1" width="0.705"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
      <a-plane src="#anthos-member-2" material="position="0 0 0" height="1" width="0.705"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2">
      <a-plane src="#louloudi-members" material="position="0 0 0" height="1" width="0.705"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 3">
      <a-plane src="#relationship-chart" material="position="0 0 0" height="1" width="0.705"></a-plane>
    </a-entity>
  </a-scene>
</body>
</html>
